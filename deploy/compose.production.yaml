x-api-base-environment: &api-base-environment
  NODE_ENV: production
  PORT: "5000"
  TRUST_PROXY_HOPS: "2"
  USE_EMBEDDED_DB: "false"
  UPLOAD_DIR: /app/backend/uploads
  MAX_FILE_SIZE_MB: "10"
  DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/production.env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in deploy/production.env}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
  JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
  FRONTEND_URL: ${FRONTEND_URL:?Set the public HTTPS origin in deploy/production.env}

x-api-environment: &api-environment
  <<: *api-base-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/production.env}

x-migration-environment: &migration-environment
  <<: *api-base-environment
  DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in deploy/production.env}

services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment: *api-environment
    expose:
      - "5000"
    volumes:
      - sect_uploads:/app/backend/uploads
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME in deploy/production.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/production.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    profiles:
      - ops
    environment: *migration-environment
    command:
      - node
      - database/migrate.js

  seed-roles:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    profiles:
      - ops
    environment: *api-environment
    command:
      - node
      - deploy/seed-roles.js

volumes:
  sect_uploads:
  caddy_data:
  caddy_config: